                poly.push([v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]);
              }
            }
            const last = pts[pts.length - 1];
            path.lineTo(last[0], last[1]);
            poly.push(last);
            const cum = [0]; // 출발점에서 각 점까지의 거리
            for (let k = 1; k < poly.length; k++) cum.push(cum[k - 1] + Math.hypot(poly[k][0] - poly[k - 1][0], poly[k][1] - poly[k - 1][1]));
            const len = cum[cum.length - 1], run = len / DRAW, hold = HOLD[0] + randT() * (HOLD[1] - HOLD[0]);
            out.push({
              path, poly, cum, len, run, hold, cycle: hold + run * 2 + REST, at: randT(), ci, ends: [pts[0], last],
              x0: Math.min(...xs) + tx - 12, x1: Math.max(...xs) + tx + 12,
              y0: Math.min(...ys) + ty - 12, y1: Math.max(...ys) + ty + 12,
            });
            break;
          }
        }
        return out;
      }

      // 밝은/어두운 화면에 맞춘 색. 어두운 화면에서는 선을 조금 밝게 합니다.
      function tint() {
        bg = getComputedStyle(root).getPropertyValue('--bg').trim() || '#EDF0EF';
        palette = COLORS.map(c => {
          if (!darkQuery.matches) return c;
          const v = parseInt(c.slice(1), 16);
          const mix = ch => Math.round(ch * .76 + 255 * .24);
          return `rgb(${mix(v >> 16)}, ${mix((v >> 8) & 255)}, ${mix(v & 255)})`;
        });
      }

      function build() {
        W = window.innerWidth; H = window.innerHeight;
        CH = H + 140; // 휴대폰 주소창이 접혀 화면이 길어져도 아래가 비지 않게 넉넉히
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        cv.width = Math.round(W * dpr); cv.height = Math.round(CH * dpr);
        cv.style.width = W + 'px'; cv.style.height = CH + 'px';
        speed = Math.min(1.6, Math.max(1, Math.min(W, H) / 420)); // 큰 화면에서는 조금 빠르게
        // 판은 화면보다 크게: 같은 선이 한 화면에 두 번 보이지 않습니다.
        const size = Math.ceil(Math.max(W, CH) * 1.15 / CELL) * CELL;
        if (size !== T) { T = size; routes = generate(); }
        tint();
      }

      // 선 하나의 지금 모습: [보이는 구간의 시작 거리, 끝 거리, 진하기]. 쉬는 중이면 null.
      // 한 바퀴: 머물기 → 출발한 쪽부터 사라지기 → 쉬기 → 출발점에서 다시 뻗기
      function stateOf(r, sec) {
        const t = (sec + r.at * r.cycle) % r.cycle;
        if (t < r.hold) return [0, r.len, 1];
        const e = t - r.hold;
        if (e < r.run) return [ease(e / r.run) * r.len, r.len, Math.min(1, (r.run - e) / FADE)];
        const d = e - r.run - REST;
        return d < 0 ? null : [0, ease(d / r.run) * r.len, Math.min(1, d / FADE)];
      }
      // 선 위에서 출발점으로부터 d만큼 간 지점
      function pointAt(r, d) {
        let k = 1;
        while (k < r.cum.length - 1 && r.cum[k] < d) k++;
        const u = (d - r.cum[k - 1]) / (r.cum[k] - r.cum[k - 1] || 1);
        return [r.poly[k - 1][0] + (r.poly[k][0] - r.poly[k - 1][0]) * u, r.poly[k - 1][1] + (r.poly[k][1] - r.poly[k - 1][1]) * u];
      }

      // 판을 (ox, oy)만큼 민 모습을 그립니다. 판을 사방으로 이어 붙여 화면에 걸친 선만 그립니다.
      // sec가 없으면(움직임 줄이기) 모든 선을 다 그려진 채로 그립니다.
      function draw(ox, oy, sec) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const seen = [];
        for (const r of routes) {
          const st = sec == null ? [0, r.len, 1] : stateOf(r, sec);
          if (!st) continue;
          for (let i = -2; i <= 1; i++) for (let j = -2; j <= 1; j++) {
            const dx = ox + i * T, dy = oy + j * T;
            if (r.x1 + dx > 0 && r.x0 + dx < W && r.y1 + dy > 0 && r.y0 + dy < CH) seen.push([r, dx, dy, st]);
          }
        }
        ctx.lineWidth = LINE;
        for (const [r, dx, dy, [a, b, alpha]] of seen) {
          ctx.setTransform(dpr, 0, 0, dpr, dx * dpr, dy * dpr);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = palette[r.ci];
          if (a <= 0 && b >= r.len) { ctx.stroke(r.path); continue; }
          // 일부만 보이는 선: 보이는 구간만 잇습니다.
          const p = pointAt(r, a), q = pointAt(r, b);
          ctx.beginPath();
          ctx.moveTo(p[0], p[1]);
          for (let k = 0; k < r.poly.length; k++) if (r.cum[k] > a && r.cum[k] < b) ctx.lineTo(r.poly[k][0], r.poly[k][1]);
          ctx.lineTo(q[0], q[1]);
          ctx.stroke();
        }
        // 도넛은 선 위에 얹습니다. 움직이는 선은 보이는 구간의 양 끝에 도넛이 따라갑니다.
        ctx.lineWidth = 4; ctx.fillStyle = bg;
        for (const [r, dx, dy, [a, b, alpha]] of seen) {
          ctx.setTransform(dpr, 0, 0, dpr, dx * dpr, dy * dpr);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = palette[r.ci];
          for (const e of a <= 0 && b >= r.len ? r.ends : [pointAt(r, a), pointAt(r, b)]) {
            ctx.beginPath();
            ctx.arc(e[0], e[1], RING, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
        }
      }

      function frame(now) {
        const sec = (now - t0) / 1000;
        draw(wrap(VX * speed * sec), wrap(VY * speed * sec), sec);
        raf = requestAnimationFrame(frame);
      }

      function show() {
        cv.hidden = false;
        // 휴대폰 주소창이 접히며 높이만 조금 바뀔 때는 다시 만들지 않습니다.
        if (!routes.length || window.innerWidth !== W || Math.abs(window.innerHeight - H) > 120) build();
        cancelAnimationFrame(raf);
        if (reduceMotion.matches) { draw(0, 0); return; } // 움직임 줄이기: 멈춘 그림으로
        if (!t0) t0 = performance.now();
        raf = requestAnimationFrame(frame);
      }
      function hide() {
        cancelAnimationFrame(raf);
        cv.hidden = true;
      }
      window.addEventListener('resize', () => { if (!cv.hidden) show(); });
      darkQuery.addEventListener('change', () => { tint(); if (!cv.hidden && reduceMotion.matches) draw(0, 0); });
      return { show, hide };
    })();
    function openSnap(sn, kind) {
      snap = sn;
      snapKind = kind;
      view = 'snap';
      render();
      window.scrollTo(0, 0);
    }
    function goHome() {
      if (busy) return;
      view = 'home';
      snap = null;
      if (location.search) history.replaceState(null, '', location.pathname); // 공유 링크 주소 정리
      setMsg('');
      els.toast.textContent = '';
      render();
      window.scrollTo(0, 0);
    }
    function clearPicks() {
      state.line = null;
      state.station = null;
      state.food = null;
      state.dessert = null;
      state.play = null;
      state.step = 0;
      choosing = false;
      save();
    }
    function startSteps(fresh) {
      if (fresh) clearPicks();
      view = 'steps';
      if (location.search) history.replaceState(null, '', location.pathname);
      setMsg('');
      render();
      window.scrollTo(0, 0);
    }

    function syncActions() {
      const homeView = view === 'home', snapView = view === 'snap';
      els.actions.hidden = homeView; // 처음 화면의 버튼(시작하기·카드)은 화면 가운데에 따로 있습니다
      els.homeBtn.hidden = !snapView;
      if (homeView || snapView) {
        for (const b of [els.draw, els.next, els.back, els.restart]) b.hidden = true;
        els.share.hidden = !snapView;
        return;
      }
      const i = state.step;
      const spinning = !!rolling;
      const has = isDrawStep(i) && !!state[STEPS[i].key];
      // 돌아가는 동안에는 멈추기 버튼 하나만 누를 수 있습니다.
      const chooser = chooserShown();
      els.draw.hidden = !isDrawStep(i) || (has && !spinning && !chooser);
      els.draw.textContent = spinning ? '멈추기' : '뽑기';
      els.draw.setAttribute('aria-disabled', String(landing)); // 멈추는 중(느려지는 동안)에는 눌러도 그대로
      els.next.hidden = !has || spinning || chooser;
      els.next.textContent = i < DONE - 1 ? `다음: ${STEPS[i + 1].title}` : '코스 보기';
      // 이전: 결과 화면에서는 이 단계의 뽑기 전 화면(목록)으로, 뽑기 전 화면에서는 앞 단계로
      const showingResult = has && !chooser;
      // 돌아가는 동안에는 이전 버튼을 보이지 않게 합니다. 자리는 그대로 둬서 "멈추기" 버튼이 움직이지 않습니다.
      if (!spinning) els.back.hidden = i === 0 && !showingResult;
      els.back.style.visibility = spinning ? 'hidden' : '';
      els.share.hidden = i !== DONE;
      els.restart.hidden = i !== DONE;
    }

    function render() {
      const homeView = view === 'home', snapView = view === 'snap';
      els.home.hidden = !homeView;
      els.bar.hidden = homeView;
      // 위쪽 진행도는 뽑는 동안에만. 코스(결과) 화면에서는 코스 목록 자체가 노선처럼 보입니다.
      els.progressNav.hidden = snapView || (view === 'steps' && state.step === DONE);
      els.stepHead.hidden = homeView;
      els.copyText.hidden = true;
      if (homeView) homeBg.show(); else homeBg.hide();
      if (homeView || snapView) {
        for (const el of [els.filter, els.catFilter, els.sign, els.item]) el.hidden = true;
        els.course.hidden = !snapView;
        if (homeView) {
          applyLineColor(null);
          renderHome();
        } else {
          const c = resolveSnap(snap);
          applyLineColor(c.line);
          els.bar.classList.add('has-line');
          els.title.textContent = snapKind === 'shared' ? '공유받은 코스' : '최근 코스';
          renderCourse(c);
        }
        syncActions();
        return;
      }
      const i = state.step;
      const key = STEPS[i].key;
      const drawStep = isDrawStep(i);
      applyLineColor();
      els.title.textContent = STEPS[i].title;

      // 뽑기 창은 뽑은 결과가 있을 때만 보입니다. (돌아가는 동안은 startRoll이 보여 줍니다.)
      const kind = chooserKind();
      const chooser = !!kind;
      const showResult = drawStep && !!state[key] && !chooser;
      // 역 단계는 뽑기 전에도 역명판을 비워 둔 채(?)로 보여 줍니다.
      els.sign.hidden = !((showResult && !isItemStep(key)) || kind === 'plain');
      els.item.hidden = !(showResult && isItemStep(key));
      els.course.hidden = key !== 'done';
      els.filter.hidden = kind !== 'line';
      els.catFilter.hidden = kind !== 'cat';
      els.copyText.hidden = true;

      if (kind === 'plain') paintSign({ line: curLine(), name: '?', empty: true, n: '?' });
      else if (drawStep && !isItemStep(key)) paintSign(signFor(key));
      if (isItemStep(key)) {
        preloadThumbs(key, enabledItems(key)); // 이 단계에 들어오면 돌릴 때 쓸 작은 사진을 미리 받습니다.
        paintItem(key, itemOf(key), false);
      }
      if (kind === 'line') renderFilter();
      if (kind === 'cat') renderCats();
      if (key === 'done') renderCourse(resolveSnap(snapFromState()));
      renderProgress();
      syncActions();
    }

    /* ---------- 버튼 ---------- */

    els.draw.addEventListener('click', draw);
    els.next.addEventListener('click', () => {
      if (performance.now() < nextLockUntil) return;
      go(state.step + 1);
    });
    // 이전: 뽑기는 한 줄로 이어진 과정이라, 이전은 "마지막으로 뽑은 것을 지우고 다시 뽑기"입니다.
    //  - 결과 화면이면 이 단계에서 뽑은 것을 지우고 이 단계의 뽑기 전 화면으로
    //  - 뽑기 전 화면(또는 코스 화면)이면 앞 단계로 가서 그 단계에서 뽑은 것을 지움
    // 어느 쪽이든 그 뒤로 뽑은 것도 모두 지워져서, 중간 것만 바꾸고 뒤를 남기는 일은 없습니다.
    els.back.addEventListener('click', () => {
      if (busy) return;
      const i = state.step;
      const j = isDrawStep(i) && state[STEPS[i].key] ? i : i - 1;
      if (j < 0) return;
      for (let k = j; k < DONE; k++) state[STEPS[k].key] = null;
      state.step = j;
      choosing = false;
      save();
      setMsg('');
      els.toast.textContent = '';
      render();
      window.scrollTo(0, 0);
      els.title.focus({ preventScroll: true });
    });

    let toastTimer;
    const toast = msg => {
      els.toast.textContent = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { els.toast.textContent = ''; }, 4000);
    };

    // 공유하기: 휴대폰 공유 창(카카오톡 등)으로 보내고, 없으면 복사합니다.
    // 보내는 글은 뽑힌 것만 한 줄, 그 아래에 링크. 글과 링크를 한 덩어리로 넘겨서 메시지 하나로 갑니다.
    // (링크 미리보기의 설명은 페이지에 고정된 글이라 코스마다 바꿀 수 없어서, 뽑힌 것은 메시지 글로 보냅니다.)
    els.share.addEventListener('click', async () => {
      const sn = view === 'snap' ? snap : snapFromState();
      const c = resolveSnap(sn);
      if (!c) return;
      const message = `${c.line.name} ${stationLabel(c.station.name)} · ${sn.food} · ${sn.dessert} · ${sn.play}\n${shareUrl(sn)}`;
      if (navigator.share) {
        try {
          await navigator.share({ text: message });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return; // 공유 창을 닫은 경우
        }
      }
      const showForManualCopy = () => {
        els.copyText.textContent = message;
        els.copyText.hidden = false;
        const range = document.createRange();
        range.selectNodeContents(els.copyText);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast('보낼 글을 선택해 두었습니다. 복사해서 보내 주세요.');
      };
      try {
        navigator.clipboard.writeText(message).then(() => toast('코스와 링크를 복사했습니다.'), showForManualCopy);
      } catch (e) { showForManualCopy(); }
    });

    // 처음부터 다시: 확인 없이 뽑은 것을 지우고 처음 화면으로
    els.restart.addEventListener('click', () => {
      if (busy) return;
      clearPicks();
      goHome();
    });
    els.homeBtn.addEventListener('click', goHome);
    els.start.addEventListener('click', () => startSteps(true));       // 시작하기는 늘 처음부터
    els.resumeCard.addEventListener('click', () => startSteps(false)); // 뽑던 곳에서 이어서
    els.recentCard.addEventListener('click', () => { const sn = loadRecent(); if (sn) openSnap(sn, 'recent'); });
    $('brand').addEventListener('click', goHome);

    // 공유 링크로 들어오면 그 코스를, 아니면 처음 화면을 보여 줍니다.
    {
      const shared = snapFromUrl();
      if (shared) { snap = shared; snapKind = 'shared'; view = 'snap'; }
    }
    render();
  }

  // 노선 데이터(data.js)와 역 좌표(coords.js)를 불러옵니다. 주소에 이 문서의 수정 시각을 붙여서,
  // 사이트를 새로 올린 직후에 브라우저에 남아 있던 예전 파일이 새 화면과 섞여 쓰이지 않게 합니다.
  // (GitHub Pages는 올릴 때마다 문서의 수정 시각이 바뀝니다.)
  // GitHub Pages는 페이지를 브라우저에 최대 10분 저장해 두게 해서, 새로 올린 직후에도 예전 화면이
  // 보일 수 있습니다. 서버의 수정 시각이 지금 페이지보다 새로우면 한 번만 새로 불러옵니다.
  fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(r => {
    const lm = r.headers.get('last-modified');
    const server = Date.parse(lm || ''), mine = new Date(document.lastModified).getTime();
    if (!server || !mine || server - mine < 2000) return;
    const key = 'random-date-reloaded-for';
    try {
      if (sessionStorage.getItem(key) === lm) return; // 이미 한 번 새로 불러왔으면 다시 하지 않음
      sessionStorage.setItem(key, lm);
    } catch (e) { return; } // 기록을 못 남기면 반복될 수 있으니 하지 않음
    location.reload();
  }).catch(() => {});

  (() => {
    const v = encodeURIComponent(document.lastModified);
    const load = src => new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = src + '?v=' + v;
      s.onload = ok;
      s.onerror = fail;
      document.head.append(s);
    });
    load('data.js')
      // 좌표·경계가 없으면 지도만 빠지거나 바탕선 없이 그려지고, 뽑기는 그대로 됩니다.
      .then(() => Promise.all([load('coords.js'), load('bounds.js'), load('photos.js')].map(p => p.catch(() => {}))))
      .then(start, () => {
        const lede = document.getElementById('lede');
        lede.textContent = '노선 데이터를 불러오지 못했습니다. 새로고침해 주세요.';
        lede.hidden = false;
      });
  })();
</script>
</body>
</html>
