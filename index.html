<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤 데이트</title>
<meta name="description" content="지역을 고르고 지하철 호선, 종점에서 몇 번째 역, 밥, 디저트, 놀거리를 한 화면에 하나씩 뽑아 데이트 코스를 정합니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='23' fill='%23fff' stroke='%2300A84D' stroke-width='12'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* Layout: one narrow column that shows a single step at a time. A route line of five stops
     across the top tracks progress and carries each picked choice under its stop; below it the
     step's big title, one station-sign card for the draw, and the action. */
  :root {
    --bg: #EDF0EF;
    --surface: #FFFFFF;
    --ink: #16212B;
    --muted: #586570;
    --rule: #CFD7D6;
    --idle: #9AA5A3;
    --line: var(--idle);
    --on-line: var(--ink);
    --line-stroke: var(--line);
    /* 노선 지도: 흰 바탕에 얇은 시 경계 */
    --map-bg: #F6F7F6;
    --map-line: #C4CCCB;
    --font-display: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161B;
      --surface: #1A232B;
      --ink: #E9EEF0;
      --muted: #9AA7B0;
      --rule: #2C3842;
      --idle: #4A5863;
      --line-stroke: color-mix(in srgb, var(--line) 72%, #FFFFFF);
      --map-bg: #182027;
      --map-line: #364450;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.6 var(--font-body);
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin-inline: auto; display: grid; gap: 20px; }
  p { margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .label { margin: 0; font: 600 .82rem/1.2 var(--font-body); letter-spacing: .05em; color: var(--muted); }

  /* top bar: site name + progress route */
  .bar { display: grid; gap: 18px; }
  .bar-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .brand { font: 400 1.2rem/1 var(--font-display); letter-spacing: .02em; }
  .progress { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .progress li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .progress li + li::before {
    content: ""; position: absolute; top: 8px; right: 50%; width: 100%; height: 5px;
    background: var(--rule); transition: background-color .35s;
  }
  .progress li.is-reached::before { background: var(--line-stroke); }
  .stopbtn {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 5px;
    width: 100%; padding: 0 2px; border: 0; background: transparent;
    color: var(--muted); font: 500 .78rem/1.2 var(--font-body); text-align: center; cursor: pointer;
  }
  /* 정거장 이름. 뽑히면 이름 자리에 뽑힌 선택지(예: 5호선)가 들어갑니다. */
  .stop-label { max-width: 100%; word-break: keep-all; overflow-wrap: anywhere; }
  .stop-label.is-picked { color: var(--ink); font-weight: 600; }
  .stopbtn::before {
    content: ""; width: 21px; height: 21px; border-radius: 50%;
    background: var(--bg); border: 5px solid var(--rule);
    transition: border-color .35s, background-color .35s;
  }
  /* 정거장은 모두 가운데가 빈 도넛. 지나온 곳은 호선 색 */
  .is-done .stopbtn::before { border-color: var(--line-stroke); }
  .is-current .stopbtn::before { border-color: var(--ink); }
  /* 호선이 뽑히면 지금 단계의 도넛도 그 호선 색으로 */
  .progress.has-line .is-current .stopbtn::before { border-color: var(--line-stroke); }
  .is-current .stop-label { color: var(--ink); font-weight: 600; }
  .stopbtn[aria-disabled="true"] { cursor: default; }

  /* the step */
  .step { display: grid; gap: 22px; }
  .step-head { display: grid; gap: 10px; }
  h1 { margin: 0; font: 400 clamp(3.2rem, 16vw, 5.5rem)/.98 var(--font-display); text-wrap: balance; }
  h1:focus { outline: none; }
  .lede { color: var(--muted); }
  .msg { font-size: .92rem; font-weight: 500; }

  /* station sign: every draw result is shown on it */
  .sign { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; padding-bottom: 20px; }
  .sign-top { display: flex; align-items: center; gap: 14px; padding: 22px 18px 26px; min-height: clamp(124px, 30vw, 148px); }
  .badge {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--line); color: var(--on-line);
    font: 400 1.9rem/1 var(--font-display);
  }
  .sign-name { min-width: 0; overflow-wrap: anywhere; font: 400 clamp(2.1rem, 10vw, 3.5rem)/1.08 var(--font-display); }
  .sign-name.is-long { font-size: clamp(1.6rem, 7vw, 2.7rem); }
  .sign-name.is-empty, .sign.is-rolling .sign-name { color: var(--muted); }
  .sign-band {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    min-height: 44px; padding: 5px 14px;
    background: var(--line); color: var(--on-line);
    font-size: .92rem; font-weight: 500; line-height: 1.2;
    transition: background-color .35s;
  }
  .sign-band > span { min-width: 0; overflow-wrap: anywhere; }
  .sign-left { grid-column: 1; }
  .sign-order { grid-column: 2; }
  .sign-right { grid-column: 3; text-align: right; }
  .sign-order {
    width: 70px; height: 70px; margin-block: -18px; border-radius: 50%;
    background: var(--surface); color: var(--ink);
    border: 5px solid var(--line);
    display: grid; place-content: center; justify-items: center; gap: 1px;
  }
  .sign-order b { font: 400 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .sign-order small { font-size: .68rem; font-weight: 500; line-height: 1; color: var(--muted); }

  /* buttons */
  .btn {
    font: 500 .95rem/1.1 var(--font-body);
    color: var(--ink); background: transparent;
    border: 1.5px solid var(--ink); border-radius: 6px;
    padding: 13px 14px; cursor: pointer;
    transition: background-color .15s, color .15s, opacity .15s;
  }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { width: 100%; background: var(--ink); color: var(--bg); font-size: 1.2rem; font-weight: 600; padding: 19px 20px; border-radius: 8px; }
  .btn-primary:hover { opacity: .86; }
  .btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
  .btn[aria-disabled="true"]:active { transform: none; }
  .actions { display: grid; gap: 10px; }
  /* 호선 목록이 길어도 뽑기 버튼이 화면 아래에 붙어 있게 합니다.
     사파리는 아래 주소창 자리를 이미 비워 두므로 홈 막대 여백(safe-area)은 더하지 않습니다. */
  .actions.is-docked {
    position: sticky; bottom: 0; z-index: 2;
    padding-top: 16px; padding-bottom: 8px;
    background: linear-gradient(to bottom, transparent, var(--bg) 16px);
  }
  .actions-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions-row .btn { flex: 1 1 auto; }
  .toast { font-size: .88rem; color: var(--muted); min-height: 1.4em; }
  .copy-text {
    margin: 0; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px;
    font: 400 .9rem/1.6 var(--font-body);
  }

  /* which lines are in the draw */
  .filter { border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 12px; padding: 12px 14px 14px; }
  .filter-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .filter-heading { display: grid; gap: 1px; min-width: 0; }
  .filter-title { margin: 0; font: 600 .95rem/1.3 var(--font-body); }
  .filter-count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini-actions { flex: none; display: flex; gap: 6px; }
  .btn-mini {
    font: 500 .78rem/1 var(--font-body); color: var(--ink); background: transparent;
    border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; cursor: pointer;
  }
  .btn-mini:hover { border-color: var(--ink); }
  /* 지역 탭: 한 번에 한 지역에서만 뽑습니다. */
  .tabs {
    display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
    margin-inline: -14px; padding-inline: 14px; border-bottom: 1px solid var(--rule);
  }
  .tab {
    flex: none; margin-bottom: -1px; padding: 8px 10px 9px;
    border: 0; border-bottom: 2px solid transparent; background: transparent;
    color: var(--muted); font: 500 .9rem/1.2 var(--font-body); cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .filter-body { display: grid; gap: 14px; }
  /* 켜 둔 노선을 실제 지도 위에 그린 그림 */
  .map {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3;
    overflow: hidden; border-radius: 4px; border: 1px solid var(--rule); background: var(--map-bg);
  }
  .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 시·구 이름은 노선 뒤에 흐리게 */
  .map-label {
    font-family: var(--font-display); fill: var(--ink); opacity: .22;
    text-anchor: middle; dominant-baseline: central; pointer-events: none;
  }
  .map-label.is-gu { opacity: .2; }
  .map-credit {
    position: absolute; right: 0; bottom: 0; margin: 0; padding: 1px 6px;
    font-size: .62rem; line-height: 1.5; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 80%, transparent);
  }
  .map-credit a { color: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 42px; height: 42px; padding: 0 13px; border-radius: 21px;
    border: 2px solid var(--c); background: var(--c); color: var(--on);
    font: 400 1.1rem/1 var(--font-display); cursor: pointer;
  }
  .chip.is-num { width: 42px; padding: 0; font-size: 1.3rem; }
  .chip[aria-pressed="false"] { background: transparent; border-color: var(--rule); color: var(--muted); }

  /* final course */
  .course { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .course li {
    display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 10px; align-items: baseline;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .course .k { font-size: .82rem; font-weight: 600; letter-spacing: .05em; color: var(--muted); }
  .course .v { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font: 400 1.6rem/1.2 var(--font-display); }
  .course .v a { color: var(--ink); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .course .v small { font: 400 .85rem/1.4 var(--font-body); color: var(--muted); }

  .dot {
    flex: none; align-self: center; width: 28px; height: 28px; border-radius: 50%;
    display: inline-grid; place-items: center;
    background: var(--c); color: var(--on);
    font: 400 1.15rem/1 var(--font-display);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="bar-top">
      <p class="brand">랜덤 데이트</p>
    </div>
    <nav aria-label="뽑힌 선택지">
      <ol class="progress" id="progress"></ol>
    </nav>
  </header>

  <main class="step">
    <div class="step-head">
      <h1 id="title" tabindex="-1">호선 뽑기</h1>
      <p class="lede" id="lede" hidden></p>
    </div>

    <section class="filter" id="filter" aria-labelledby="filter-title" hidden>
      <div class="filter-head">
        <div class="filter-heading">
          <h2 class="filter-title" id="filter-title">뽑을 호선 고르기</h2>
          <p class="filter-count" id="filter-count"></p>
        </div>
        <div class="mini-actions">
          <button id="all-on" class="btn-mini" type="button">전부 켜기</button>
          <button id="all-off" class="btn-mini" type="button">전부 끄기</button>
        </div>
      </div>
      <div class="tabs" id="region-tabs" role="tablist" aria-label="지역"></div>
      <div class="filter-body" id="region-panel" role="tabpanel">
        <div class="map" id="line-map" hidden>
          <svg class="map-lines" id="map-lines" role="img" aria-label="켜 둔 노선 지도"></svg>
          <p class="map-credit">경계: <a href="https://sgis.kostat.go.kr/" target="_blank" rel="noopener">통계청 SGIS</a></p>
        </div>
        <div class="chips" id="line-chips"></div>
      </div>
    </section>

    <div class="sign" id="sign" hidden>
      <div class="sign-top">
        <span class="badge" id="badge" hidden></span>
        <div class="sign-name is-empty" id="sign-name">?</div>
      </div>
      <div class="sign-band" id="band">
        <span class="sign-left" id="band-left"></span>
        <span class="sign-order" id="order" hidden><b id="order-n">?</b><small>번째</small></span>
        <span class="sign-right" id="band-right"></span>
      </div>
    </div>
    <p class="msg" id="msg" hidden></p>

    <ol class="course" id="course" hidden></ol>

    <div class="actions" id="actions">
      <button id="draw" class="btn btn-primary" type="button" hidden>뽑기</button>
      <button id="next" class="btn btn-primary" type="button" hidden>다음</button>
      <div class="actions-row">
        <button id="back" class="btn" type="button" hidden>이전</button>
        <button id="redraw" class="btn" type="button" hidden>다시 뽑기</button>
        <button id="choose" class="btn" type="button" hidden>호선 목록</button>
        <button id="copy" class="btn" type="button" hidden>목록 복사</button>
        <button id="restart" class="btn" type="button" hidden>처음부터 다시</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
      <pre class="copy-text" id="copy-text" hidden></pre>
    </div>

  </main>

  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<script>
  // data.js가 로드된 뒤에 실행됩니다. (맨 아래에서 불러옵니다.)
  function start() {
    'use strict';
    const $ = id => document.getElementById(id);
    const root = document.documentElement;
    const KEY = 'random-date-v5';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const regionById = Object.fromEntries(REGIONS.map(r => [r.id, r]));
    const DECKS = { food: FOOD, dessert: DESSERT, play: PLAY };

    // 화면은 한 번에 한 단계만 보여 줍니다. 0~4번이 뽑는 단계, 마지막이 코스입니다.
    // 지역은 호선 뽑기 단계의 "뽑을 호선 고르기" 탭에서 고릅니다.
    const STEPS = [
      { key: 'line', title: '호선 뽑기', short: '호선' },
      { key: 'station', title: '역 뽑기', short: '역' },
      { key: 'food', title: '밥 뽑기', short: '밥' },
      { key: 'dessert', title: '디저트 뽑기', short: '디저트' },
      { key: 'play', title: '놀거리 뽑기', short: '놀거리' },
      { key: 'done', title: '오늘의 코스' },
    ];
    const DONE = STEPS.length - 1;
    const isDrawStep = i => i >= 0 && i < DONE;

    // 이 브라우저에만 기억합니다. 저장소를 못 쓰는 환경에서도 그대로 동작합니다.
    const store = {
      get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 기억만 못 함 */ } },
    };

    const state = { region: REGIONS[0].id, off: {}, step: 0, line: null, station: null, food: null, dessert: null, play: null };

    const region = () => regionById[state.region];
    const curLine = () => region().lines.find(l => l.id === state.line) || null;
    // 직접 고른 적이 없는 지역은 기본 선택(optional 노선은 꺼 둠)을 씁니다.
    const offSet = () => new Set(state.off[state.region] || region().optional || []);
    const enabledLines = () => { const off = offSet(); return region().lines.filter(l => !off.has(l.id)); };
    const itemOf = key => DECKS[key].find(i => i.label === state[key]) || null;
    // 앞 단계를 뽑아야 다음 단계로 갈 수 있습니다.
    function reachable(i) {
      if (i <= 0) return true;
      return !!state[STEPS[i - 1].key] && reachable(i - 1);
    }

    {
      const s = store.get(KEY);
      if (s && typeof s === 'object') {
        if (regionById[s.region]) state.region = s.region;
        if (s.off && typeof s.off === 'object') {
          for (const r of REGIONS) {
            if (Array.isArray(s.off[r.id])) state.off[r.id] = s.off[r.id].filter(id => r.lines.some(l => l.id === id));
          }
        }
        const line = region().lines.find(l => l.id === s.line);
        if (line) {
          state.line = line.id;
          const st = s.station;
          if (st && typeof st === 'object') {
            state.station = stationChoices(line).find(c => c.name === st.name && c.origin === st.origin && c.n === st.n) || null;
          }
        }
        for (const k of ['food', 'dessert', 'play']) {
          if (DECKS[k].some(i => i.label === s[k])) state[k] = s[k];
        }
        if (Number.isInteger(s.step) && s.step >= 0 && s.step <= DONE) state.step = s.step;
        while (!reachable(state.step)) state.step--;
      }
    }
    const save = () => store.set(KEY, state);

    const els = {
      progress: $('progress'), title: $('title'),
      sign: $('sign'), badge: $('badge'), name: $('sign-name'), band: $('band'),
      left: $('band-left'), order: $('order'), n: $('order-n'), right: $('band-right'),
      msg: $('msg'), course: $('course'),
      draw: $('draw'), next: $('next'), back: $('back'), redraw: $('redraw'), copy: $('copy'), restart: $('restart'),
      toast: $('toast'), copyText: $('copy-text'),
      filter: $('filter'), filterCount: $('filter-count'), chips: $('line-chips'),
      tabs: $('region-tabs'), panel: $('region-panel'),
      choose: $('choose'), actions: $('actions'), live: $('live'),
    };

    const mapUrl = q => 'https://map.naver.com/p/search/' + encodeURIComponent(q);
    const countOf = s => `${s.loop ? s.origin : s.origin + '에서'} ${s.n}번째`;
    const setMsg = text => { els.msg.textContent = text || ''; els.msg.hidden = !text; };
    const announce = text => { els.live.textContent = text; };
    const isNum = line => /^\d+$/.test(line.short);

    const make = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const dot = line => {
      const d = make('span', 'dot', isNum(line) ? line.short : '');
      d.style.setProperty('--c', line.color);
      d.style.setProperty('--on', line.on);
      return d;
    };
    const mapLink = (text, q) => {
      const a = make('a', null, text + ' ↗');
      a.href = mapUrl(q);
      a.target = '_blank';
      a.rel = 'noopener';
      return a;
    };

    /* ---------- 역명판: 뽑힌 결과를 보여 주는 판 ---------- */

    const lineView = l => ({ line: l, name: l.name, left: region().name, right: `${stationCount(l)}개 역` });
    const stationView = (l, s) => ({
      line: l, name: stationLabel(s.name), n: s.n,
      left: s.prev ? '‹ ' + s.prev : '종점',
      right: s.next ? s.next + ' ›' : '종점',
    });
    const itemView = i => ({ name: i.label, left: i.cat });

    function signFor(key) {
      const line = curLine();
      if (key === 'line') return line ? lineView(line) : { name: '?', empty: true };
      if (key === 'station') return state.station ? stationView(line, state.station) : { line, name: '?', empty: true, n: '?' };
      const item = itemOf(key);
      return item ? itemView(item) : { name: '?', empty: true };
    }

    function paintSign(v) {
      const line = v.line || null;
      els.badge.hidden = !line;
      if (line) {
        els.badge.textContent = isNum(line) ? line.short : '';
        els.badge.style.background = line.color;
        els.badge.style.color = line.on;
      }
      els.name.textContent = v.name;
      els.name.classList.toggle('is-empty', !!v.empty);
      els.name.classList.toggle('is-long', !v.empty && v.name.length >= 7);
      els.order.hidden = v.n == null;
      els.n.textContent = v.n == null ? '' : String(v.n);
      els.left.textContent = v.left || '';
      els.right.textContent = v.right || '';
      // 뽑는 동안에는 지나가는 호선 색을 따라갑니다. 평소에는 뽑힌 호선 색(--line)을 씁니다.
      els.band.style.background = line ? line.color : '';
      els.band.style.color = line ? line.on : '';
      els.order.style.borderColor = line ? line.color : '';
    }

    /* ---------- 뽑기: 한 번에 하나 ---------- */

    let busy = false;
    let rolling = null;      // 돌아가는 동안에만 { stop() }
    let nextLockUntil = 0;   // 멈춘 직후 잘못 눌린 "다음"을 잠깐 막습니다.
    let choosing = false;    // 호선을 뽑은 뒤 "호선 목록"으로 다시 목록을 보는 중

    // 호선 단계는 뽑기 전에는 호선 목록만, 뽑기 시작 후에는 뽑기 창만 보여 줍니다.
    const chooserShown = () => STEPS[state.step].key === 'line' && !rolling && (!state.line || choosing);

    // 뽑기를 누르면 후보가 계속 돌아가고, 한 번 더 누르면 그때 보이던 것으로 정해집니다.
    function startRoll(pool, show, commit) {
      const finish = value => {
        rolling = null;
        busy = false;
        els.sign.classList.remove('is-rolling');
        commit(value);
      };
      if (pool.length < 2) { finish(pool[0]); return; } // 후보가 하나면 바로 정해집니다.
      const still = reduceMotion.matches; // 움직임 줄이기 설정이면 깜빡이지 않고 멈출 때 뽑습니다.
      let current = pickOne(pool);
      let timer = null;
      const tick = () => {
        let v = pickOne(pool);
        if (v === current) v = pool[(pool.indexOf(v) + 1) % pool.length];
        current = v;
        show(current);
        timer = setTimeout(tick, 70);
      };
      busy = true;
      rolling = {
        stop() {
          clearTimeout(timer);
          const value = still ? pickOne(pool) : current;
          show(value);
          finish(value);
        },
      };
      els.sign.classList.add('is-rolling');
      const wasChoosing = !els.filter.hidden;
      choosing = false;
      els.filter.hidden = true;
      els.actions.classList.remove('is-docked');
      els.sign.hidden = false;
      if (wasChoosing) window.scrollTo(0, 0);
      if (still) paintSign({ name: '뽑는 중', empty: true }); else tick();
      setMsg('');
      syncActions();
      els.draw.focus({ preventScroll: true });
    }

    function draw() {
      if (!isDrawStep(state.step)) return;
      if (rolling) { rolling.stop(); return; }
      if (busy) return;
      const step = STEPS[state.step];
      const key = step.key;
      setMsg('');
      const finishDraw = text => {
        save();
        nextLockUntil = performance.now() + 600;
        setMsg('');
        render();
        announce(`${step.short}: ${text}`);
        els.next.focus({ preventScroll: true });
      };

      if (key === 'line') {
        const on = enabledLines();
        if (!on.length) {
          choosing = true;
          render();
          setMsg('켜 둔 호선이 없습니다. "뽑을 호선 고르기"에서 하나 이상 켜 주세요.');
          return;
        }
        const others = on.filter(l => l.id !== state.line);
        if (state.line && !others.length) {
          setMsg('켜 둔 호선이 하나뿐이라 다시 뽑아도 같습니다.');
          return;
        }
        startRoll(others.length ? others : on, l => paintSign(lineView(l)), pick => {
          if (pick.id !== state.line) state.station = null;
          state.line = pick.id;
          finishDraw(pick.name);
        });
        return;
      }

      if (key === 'station') {
        const line = curLine();
        const current = state.station && state.station.name;
        const pool = stationChoices(line).filter(c => c.name !== current);
        startRoll(pool, s => paintSign(stationView(line, s)), pick => {
          state.station = pick;
          finishDraw(stationLabel(pick.name));
        });
        return;
      }

      const pool = DECKS[key].filter(i => i.label !== state[key]);
      startRoll(pool, i => paintSign(itemView(i)), pick => {
        state[key] = pick.label;
        finishDraw(pick.label);
      });
    }

    function go(i) {
      if (busy || i < 0 || i > DONE || !reachable(i)) return;
      state.step = i;
      choosing = false;
      save();
      disarmRestart();
      setMsg('');
      els.toast.textContent = '';
      render();
      window.scrollTo(0, 0);
      els.title.focus({ preventScroll: true });
    }

    // 지역을 바꾸면 그 지역 노선으로 다시 뽑아야 하므로 뽑아 둔 호선과 역은 지웁니다.
    function selectRegion(id, focusTab) {
      if (busy || id === state.region || !regionById[id]) return;
      state.region = id;
      state.line = null;
      state.station = null;
      save();
      setMsg('');
      render();
      if (focusTab) $('tab-' + id).focus();
    }

    /* ---------- 화면 그리기 ---------- */

    function applyLineColor() {
      const line = curLine();
      if (line) {
        root.style.setProperty('--line', line.color);
        root.style.setProperty('--on-line', line.on);
      } else {
        root.style.removeProperty('--line');
        root.style.removeProperty('--on-line');
      }
    }

    // 상단 노선도: 정거장마다 뽑힌 선택지를 적습니다.
    function stopValue(key) {
      if (key === 'line') { const line = curLine(); return line ? line.name : ''; }
      if (key === 'station') return state.station ? stationLabel(state.station.name) : '';
      return state[key] || '';
    }
    function renderProgress() {
      els.progress.classList.toggle('has-line', !!curLine());
      els.progress.replaceChildren(...[0, 1, 2, 3, 4].map(i => {
        const value = stopValue(STEPS[i].key);
        const picked = !!value;
        const current = state.step === i;
        const li = make('li', [current && 'is-current', picked && !current && 'is-done', (picked || current) && 'is-reached'].filter(Boolean).join(' '));
        const b = make('button', 'stopbtn');
        b.append(make('span', 'stop-label' + (picked ? ' is-picked' : ''), value || STEPS[i].short));
        b.setAttribute('aria-label', picked ? `${STEPS[i].short}: ${value}` : STEPS[i].short);
        b.type = 'button';
        b.setAttribute('aria-disabled', String(!reachable(i)));
        if (current) b.setAttribute('aria-current', 'step');
        b.addEventListener('click', () => go(i));
        li.append(b);
        return li;
      }));
    }

    function renderTabs() {
      els.tabs.replaceChildren(...REGIONS.map((r, i) => {
        const selected = r.id === state.region;
        const b = make('button', 'tab', r.name);
        b.type = 'button';
        b.id = 'tab-' + r.id;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(selected));
        b.setAttribute('aria-controls', 'region-panel');
        b.tabIndex = selected ? 0 : -1;
        b.addEventListener('click', () => selectRegion(r.id));
        b.addEventListener('keydown', e => {
          const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
          if (!step) return;
          e.preventDefault();
          selectRegion(REGIONS[(i + step + REGIONS.length) % REGIONS.length].id, true);
        });
        return b;
      }));
      els.panel.setAttribute('aria-labelledby', 'tab-' + state.region);
    }

    function updateCount() {
      els.filterCount.textContent = `${region().lines.length}개 중 ${enabledLines().length}개 켜짐`;
    }
    /* ---------- 켜 둔 노선 지도 ---------- */

    // 흰 바탕에 시 경계(서울은 구 경계까지)를 얇게 긋고, 시·구 이름은 흐리게 깝니다.
    // 그 위에 켜 둔 노선을 노선 색으로, 종점은 속이 빈 도넛으로 그립니다. 확대·이동 없는 그림입니다.
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    const mapEls = { box: $('line-map'), svg: $('map-lines') };
    const SVGNS = 'http://www.w3.org/2000/svg';
    const project = (lat, lon) => {
      const s = Math.sin((lat * Math.PI) / 180);
      return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
    };
    const coordOf = (line, name) => {
      const c = COORDS[state.region] || {};
      return c[line.id + ':' + name] || c[name] || null;
    };
    const linePaths = line => line.routes.map(r => {
      const pts = r.stations.map(n => coordOf(line, n)).filter(Boolean).map(([lat, lon]) => project(lat, lon));
      if (r.loop && pts.length > 2) pts.push(pts[0]);
      return pts;
    }).filter(p => p.length > 1);
    // 종점: 구간의 끝 역 중 다른 구간 한가운데에 있지 않은 역 (갈라지는 역은 빼고, 순환선은 없음)
    const terminiOf = line => {
      const inner = new Set(line.routes.flatMap(r => (r.loop ? r.stations : r.stations.slice(1, -1))));
      const ends = new Set(line.routes.filter(r => !r.loop).flatMap(r => [r.stations[0], r.stations[r.stations.length - 1]]));
      return [...ends].filter(n => !inner.has(n)).map(n => coordOf(line, n)).filter(Boolean).map(([lat, lon]) => project(lat, lon));
    };
    // bounds.js(시·구 도형)를 메르카토르 좌표로 풉니다. 지역마다 한 번만 풉니다.
    const geoCache = {};
    const P = (lon, lat) => project(lat / 1e4, lon / 1e4);
    function geoOf(rid) {
      if (typeof BOUNDS === 'undefined' || !BOUNDS[rid]) return null;
      if (geoCache[rid]) return geoCache[rid];
      const B = BOUNDS[rid];
      const arcs = B.a.map(arr => {
        const pts = [];
        let x = 0, y = 0;
        for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; pts.push(P(x, y)); }
        return pts;
      });
      const arcPts = i => (i >= 0 ? arcs[i] : arcs[~i].slice().reverse());
      const ringPts = ring => ring.flatMap((i, j) => (j ? arcPts(i).slice(1) : arcPts(i)));
      const place = (name, lx, ly, w, s, e, n) => ({ name, at: P(lx, ly), min: P(w, n), max: P(e, s) });
      return (geoCache[rid] = {
        arcs,
        cities: B.c.map(([name, color, lx, ly, w, s, e, n, rings]) => ({ ...place(name, lx, ly, w, s, e, n), color, rings: rings.map(ringPts) })),
        borders: B.b.map(i => arcs[i]),
        gu: B.g.map(i => arcs[i]),
        guPlaces: B.d.map(([name, lx, ly, w, s, e, n]) => place(name, lx, ly, w, s, e, n)),
      });
    }

    function renderMap() {
      const box = mapEls.box;
      if (typeof COORDS === 'undefined' || !COORDS[state.region]) { box.hidden = true; return; }
      box.hidden = false;
      const W = box.clientWidth, H = box.clientHeight;
      if (!W || !H) return;

      const off = offSet();
      const all = region().lines.map(l => ({ line: l, on: !off.has(l.id), paths: linePaths(l) }));
      const focus = all.some(x => x.on) ? all.filter(x => x.on) : all;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const x of focus) for (const p of x.paths) for (const [px, py] of p) {
        minX = Math.min(minX, px); maxX = Math.max(maxX, px);
        minY = Math.min(minY, py); maxY = Math.max(maxY, py);
      }
      if (!Number.isFinite(minX)) { box.hidden = true; return; }

      // 켜 둔 노선이 다 들어오는 배율 (메르카토르 좌표 → 화면 픽셀)
      const pad = 16;
      const scale = Math.min((W - 2 * pad) / Math.max(maxX - minX, 1e-9), (H - 2 * pad) / Math.max(maxY - minY, 1e-9), 2 ** 23);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const toScreen = ([px, py]) => [(px - cx) * scale + W / 2, (py - cy) * scale + H / 2];
      // 멀리서 볼수록(넓은 지역) 선과 도넛을 가늘고 작게, 켜 둔 노선이 많으면 조금 더 줄입니다.
      const zoom = Math.log2(scale / 256);
      const near = Math.min(1, Math.max(0, (zoom - 8) / 3)); // 줌 8 이하 0, 11 이상 1
      const dense = focus.length > 8 ? 0.85 : 1;
      const lineW = (2 + 1.5 * near) * dense;
      const ringR = (3 + 1.5 * near) * dense;
      const ringW = (1.6 + 1.4 * near) * dense;
      const pointsOf = pts => pts.map(p => toScreen(p).map(v => v.toFixed(1)).join(',')).join(' ');

      const svg = mapEls.svg;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const css = name => getComputedStyle(mapEls.box).getPropertyValue(name).trim();
      const bg = css('--map-bg'), edge = css('--map-line');
      const el = (tag, attrs) => {
        const node = document.createElementNS(SVGNS, tag);
        for (const [a, v] of Object.entries(attrs)) node.setAttribute(a, v);
        return node;
      };
      const line = (pts, attrs) => el('polyline', {
        points: pointsOf(pts), fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...attrs,
      });
      const dOf = (list, close) => list.map(pts => 'M' + pts.map(p => toScreen(p).map(v => v.toFixed(1)).join(' ')).join('L') + (close ? 'Z' : '')).join('');
      const nodes = [];

      const geo = geoOf(state.region);
      if (geo) {
        // 서울 구 경계는 더 가늘게, 시 경계와 해안선은 얇게
        nodes.push(el('path', { d: dOf(geo.gu), fill: 'none', stroke: edge, 'stroke-width': 0.5, 'stroke-linejoin': 'round' }));
        nodes.push(el('path', { d: dOf(geo.borders), fill: 'none', stroke: edge, 'stroke-width': 0.8, 'stroke-linejoin': 'round' }));

        // 이름은 흐리게, 노선보다 뒤에. 칸에 들어가고 서로 겹치지 않는 것만 적습니다.
        const placed = [];
        const labels = [];
        const tryLabel = (pl, size, cls) => {
          const [x, y] = toScreen(pl.at);
          const [x0, y0] = toScreen(pl.min), [x1, y1] = toScreen(pl.max);
          const tw = pl.name.length * size * 0.92 + 2, th = size * 1.1;
          if (x1 - x0 < tw || y1 - y0 < th * 1.3) return false;
          const r = [x - tw / 2, y - th / 2, x + tw / 2, y + th / 2];
          if (r[0] < 2 || r[1] < 2 || r[2] > W - 2 || r[3] > H - 2) return false;
          if (placed.some(q => r[0] < q[2] + 3 && r[2] > q[0] - 3 && r[1] < q[3] + 2 && r[3] > q[1] - 2)) return false;
          placed.push(r);
          const t = el('text', { x: x.toFixed(1), y: y.toFixed(1), class: cls, 'font-size': size });
          t.textContent = pl.name;
          labels.push(t);
          return true;
        };
        const byArea = list => [...list].sort((a, b) =>
          (b.max[0] - b.min[0]) * (b.max[1] - b.min[1]) - (a.max[0] - a.min[0]) * (a.max[1] - a.min[1]));
        const guCount = byArea(geo.guPlaces).filter(pl => tryLabel(pl, 10, 'map-label is-gu')).length;
        for (const c of byArea(geo.cities)) {
          if (c.name === '서울' && guCount >= 3) continue; // 구 이름이 보이면 "서울"은 생략
          tryLabel(c, 13, 'map-label');
        }
        nodes.push(...labels);
      }

      // 켜 둔 노선: 바탕색 테두리를 둘러 겹쳐도 구분되게
      for (const x of all) if (x.on) for (const p of x.paths) nodes.push(line(p, { stroke: bg, 'stroke-width': (lineW + 2.5).toFixed(2), 'stroke-opacity': 0.9 }));
      for (const x of all) if (x.on) {
        const g = el('g', {});
        const title = el('title', {});
        title.textContent = x.line.name;
        g.append(title, ...x.paths.map(p => line(p, { stroke: x.line.color, 'stroke-width': lineW.toFixed(2) })));
        nodes.push(g);
      }
      // 노선의 처음과 끝은 가운데가 빈 도넛으로 표시합니다.
      for (const x of all) if (x.on) for (const p of terminiOf(x.line)) {
        const [sx, sy] = toScreen(p).map(v => v.toFixed(1));
        nodes.push(el('circle', { cx: sx, cy: sy, r: ringR.toFixed(2), fill: bg, stroke: x.line.color, 'stroke-width': ringW.toFixed(2) }));
      }
      const names = all.filter(x => x.on).map(x => x.line.name);
      svg.setAttribute('aria-label', names.length ? `켜 둔 노선 지도: ${names.join(', ')}` : '켜 둔 노선이 없습니다');
      svg.replaceChildren(...nodes);
    }
    darkQuery.addEventListener('change', () => { if (!els.filter.hidden) renderMap(); }); // 지도 색이 바뀝니다.
    let resizeFrame = 0;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (!els.filter.hidden) renderMap(); });
    });

    function renderFilter() {
      const off = offSet();
      renderTabs();
      els.chips.replaceChildren(...region().lines.map(l => {
        const b = make('button', 'chip' + (isNum(l) ? ' is-num' : ''), l.short);
        b.type = 'button';
        b.style.setProperty('--c', l.color);
        b.style.setProperty('--on', l.on);
        b.setAttribute('aria-label', l.name);
        b.setAttribute('aria-pressed', String(!off.has(l.id)));
        b.addEventListener('click', () => {
          if (busy) return;
          const now = offSet();
          if (now.has(l.id)) now.delete(l.id); else now.add(l.id);
          state.off[state.region] = [...now];
          save();
          b.setAttribute('aria-pressed', String(!now.has(l.id)));
          setMsg('');
          updateCount();
          renderMap();
        });
        return b;
      }));
      updateCount();
      renderMap();
    }
    const setAllLines = on => {
      if (busy) return;
      state.off[state.region] = on ? [] : region().lines.map(l => l.id);
      save();
      setMsg('');
      renderFilter();
    };
    els.choose.addEventListener('click', () => {
      if (busy) return;
      choosing = true;
      setMsg('');
      render();
    });
    $('all-on').addEventListener('click', () => setAllLines(true));
    $('all-off').addEventListener('click', () => setAllLines(false));

    function renderCourse() {
      const line = curLine();
      const s = state.station;
      const where = stationQuery(s.name);
      const row = (k, ...v) => {
        const li = make('li');
        const val = make('span', 'v');
        val.append(...v);
        li.append(make('span', 'k', k), val);
        return li;
      };
      const rows = [
        row('지역', region().name),
        row('호선', dot(line), line.name),
        row('역', mapLink(stationLabel(s.name), where), make('small', null, countOf(s))),
      ];
      for (const k of ['food', 'dessert', 'play']) {
        const item = itemOf(k);
        rows.push(row(STEPS.find(x => x.key === k).short, mapLink(item.label, where + ' ' + item.q), make('small', null, item.cat)));
      }
      els.course.replaceChildren(...rows);
    }

    function syncActions() {
      const i = state.step;
      const spinning = !!rolling;
      const has = isDrawStep(i) && !!state[STEPS[i].key];
      // 돌아가는 동안에는 멈추기 버튼 하나만 누를 수 있습니다.
      const chooser = chooserShown();
      els.draw.hidden = !isDrawStep(i) || (has && !spinning && !chooser);
      els.draw.textContent = spinning ? '멈추기' : '뽑기';
      els.next.hidden = !has || spinning || chooser;
      els.next.textContent = i < DONE - 1 ? `다음: ${STEPS[i + 1].title}` : '코스 보기';
      els.redraw.hidden = !has || spinning || chooser;
      els.choose.hidden = !(STEPS[i].key === 'line' && has && !spinning && !chooser);
      els.back.hidden = i === 0;
      els.back.setAttribute('aria-disabled', String(spinning));
      els.copy.hidden = i !== DONE;
      els.restart.hidden = i !== DONE;
    }

    function render() {
      const i = state.step;
      const key = STEPS[i].key;
      const drawStep = isDrawStep(i);
      applyLineColor();
      els.title.textContent = STEPS[i].title;

      // 뽑기 창은 뽑은 결과가 있을 때만 보입니다. (돌아가는 동안은 startRoll이 보여 줍니다.)
      const chooser = chooserShown();
      els.sign.hidden = !(drawStep && !!state[key] && !chooser);
      els.course.hidden = key !== 'done';
      els.filter.hidden = !chooser;
      els.actions.classList.toggle('is-docked', chooser);
      els.copyText.hidden = true;


      if (drawStep) paintSign(signFor(key));
      if (chooser) renderFilter();
      if (key === 'done') renderCourse();
      renderProgress();
      syncActions();
    }

    /* ---------- 버튼 ---------- */

    els.draw.addEventListener('click', draw);
    els.redraw.addEventListener('click', draw);
    els.next.addEventListener('click', () => {
      if (performance.now() < nextLockUntil) return;
      go(state.step + 1);
    });
    els.back.addEventListener('click', () => go(state.step - 1));

    let toastTimer;
    const toast = msg => {
      els.toast.textContent = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { els.toast.textContent = ''; }, 4000);
    };

    els.copy.addEventListener('click', () => {
      const s = state.station;
      const text = [
        `지역: ${region().name}`,
        `호선: ${curLine().name}`,
        `역: ${stationLabel(s.name)} (${countOf(s)})`,
        `밥: ${state.food}`,
        `디저트: ${state.dessert}`,
        `놀거리: ${state.play}`,
      ].join('\n');
      const showForManualCopy = () => {
        els.copyText.textContent = text;
        els.copyText.hidden = false;
        const range = document.createRange();
        range.selectNodeContents(els.copyText);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast('자동 복사가 막혀 있어 목록을 선택해 두었습니다. 직접 복사해 주세요.');
      };
      try {
        navigator.clipboard.writeText(text).then(() => toast('목록을 복사했습니다.'), showForManualCopy);
      } catch (e) { showForManualCopy(); }
    });

    let restartArmed = false;
    let restartTimer;
    function disarmRestart() {
      restartArmed = false;
      clearTimeout(restartTimer);
      els.restart.textContent = '처음부터 다시';
    }
    els.restart.addEventListener('click', () => {
      if (!restartArmed) {
        restartArmed = true;
        els.restart.textContent = '한 번 더 누르면 지웁니다';
        restartTimer = setTimeout(disarmRestart, 4000);
        return;
      }
      state.line = null;
      state.station = null;
      state.food = null;
      state.dessert = null;
      state.play = null;
      go(0);
    });

    render();
  }

  // 노선 데이터(data.js)와 역 좌표(coords.js)를 불러옵니다. 주소에 이 문서의 수정 시각을 붙여서,
  // 사이트를 새로 올린 직후에 브라우저에 남아 있던 예전 파일이 새 화면과 섞여 쓰이지 않게 합니다.
  // (GitHub Pages는 올릴 때마다 문서의 수정 시각이 바뀝니다.)
  // GitHub Pages는 페이지를 브라우저에 최대 10분 저장해 두게 해서, 새로 올린 직후에도 예전 화면이
  // 보일 수 있습니다. 서버의 수정 시각이 지금 페이지보다 새로우면 한 번만 새로 불러옵니다.
  fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(r => {
    const lm = r.headers.get('last-modified');
    const server = Date.parse(lm || ''), mine = new Date(document.lastModified).getTime();
    if (!server || !mine || server - mine < 2000) return;
    const key = 'random-date-reloaded-for';
    try {
      if (sessionStorage.getItem(key) === lm) return; // 이미 한 번 새로 불러왔으면 다시 하지 않음
      sessionStorage.setItem(key, lm);
    } catch (e) { return; } // 기록을 못 남기면 반복될 수 있으니 하지 않음
    location.reload();
  }).catch(() => {});

  (() => {
    const v = encodeURIComponent(document.lastModified);
    const load = src => new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = src + '?v=' + v;
      s.onload = ok;
      s.onerror = fail;
      document.head.append(s);
    });
    load('data.js')
      // 좌표·경계가 없으면 지도만 빠지거나 바탕선 없이 그려지고, 뽑기는 그대로 됩니다.
      .then(() => Promise.all([load('coords.js'), load('bounds.js')].map(p => p.catch(() => {}))))
      .then(start, () => {
        const lede = document.getElementById('lede');
        lede.textContent = '노선 데이터를 불러오지 못했습니다. 새로고침해 주세요.';
        lede.hidden = false;
      });
  })();
</script>
</body>
</html>
